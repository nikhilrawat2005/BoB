name: Bob Scheduler Tick

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      BOB_URL: ${{ secrets.BOB_URL }}
    steps:
      - name: Trigger Bob scheduler tick
        run: |
          URL="${BOB_URL:-https://bob-backend.vercel.app}"
          curl -sS -o /dev/null -w "tick HTTP %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$URL/api/scheduler/tick"
